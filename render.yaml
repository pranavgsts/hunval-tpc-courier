# Render Blueprint: creates the web service and its Postgres database.
# Render dashboard → New → Blueprint → pick this repo. Values marked sync: false are asked for on first deploy.
services:
  - type: web
    name: hunval-tpc-courier
    runtime: node
    # Paid instance on purpose: free instances sleep, so Shopify webhooks time out and
    # the 5-minute re-send of pending bookings stops running.
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: hunval-tpc-db
          property: connectionString
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      # Start in dry-run. Switch to live once dry-run results look right.
      - key: TPC_MODE
        value: dry-run
      - key: TPC_API_URL
        value: http://tcg.tpctn.in/apps/api/booking
      - key: TPC_API_KEY
        sync: false
      - key: TPC_API_ID
        sync: false
      - key: TPC_RANGE_KIND
        value: test
      - key: TPC_SYSTEM_NAME
        value: Shopify
      - key: TPC_CONTENT_DESC
        value: Apparel
      - key: PACKAGING_GRAMS
        value: "100"
      - key: BOOK_COD_ORDERS
        value: "false"
      - key: TRACKING_COMPANY
        value: The Professional Couriers
      - key: TRACKING_URL_TEMPLATE
        sync: false

databases:
  - name: hunval-tpc-db
    plan: basic-256mb
    region: singapore
